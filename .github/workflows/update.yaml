name: 更新 Wiki 表情列表

on:
  push:
    branches:
      - "main"
    paths:
      - "meme_generator/memes/**"
      - "meme_generator/memes_jj/**"
      - "meme_generator/memes_emoji/**"
      - "meme_generator/memes_other/**"
      - "meme_generator/memes_emoji_nsfw/**"
      - "meme_generator/memes_cute/**"
      - "meme_generator/memes_tudou/**"
      - "meme_generator/memes_contrib/**"
      - "meme_generator/memes_crazy_emoji/**"
  workflow_dispatch:

concurrency: update-wiki

permissions:
  contents: write

jobs:
  update_wiki:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 检出 Wiki 仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          ref: master
          path: wiki

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: 安装字体
        run: |
          sudo apt update -y
          sudo apt install -y fonts-noto-color-emoji libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libegl1-mesa-dev
          sudo mkdir -p /usr/share/fonts/myfonts
          sudo cp resources/fonts/* /usr/share/fonts/myfonts/
          fc-cache -fv
      - name: 更新 memes.md 文件
        run: uv run --locked --no-dev python wiki/update_meme_list.py

      - name: 提交并推送 Wiki 更新
        working-directory: wiki
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki 没有变更'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新 Meme 列表'
          git push origin HEAD:refs/heads/master
