name: 同步表情仓库

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref }}

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 检出上游表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: MemeCrafters/meme-generator
          path: .upstream/meme
          persist-credentials: false

      - name: 检出 JJ 表情
        uses: actions/checkout@v4
        with:
          ref: master
          repository: jinjiao007/meme-generator-jj
          path: .upstream/memes_jj
          persist-credentials: false

      - name: 检出 Emoji 表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: anyliew/meme_emoji
          path: .upstream/memes_emoji
          persist-credentials: false

      - name: 检出 NSFW 表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: anyliew/meme_emoji_nsfw
          path: .upstream/memes_emoji_nsfw
          persist-credentials: false

      - name: 检出 Cute 表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: AIGC-Yunzai/meme-generator-cute
          path: .upstream/memes_cute
          persist-credentials: false

      - name: 检出土豆表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: LRZ9712/tudou-meme
          path: .upstream/memes_tudou
          persist-credentials: false

      - name: 检出 Contrib 表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: MemeCrafters/meme-generator-contrib
          path: .upstream/memes_contrib
          persist-credentials: false

      - name: 检出 Crazy Emoji 表情
        uses: actions/checkout@v4
        with:
          ref: main
          repository: anyliew/crazy_emoji
          path: .upstream/memes_crazy_emoji
          persist-credentials: false

      - name: 同步表情并推送变更
        id: sync_memes
        shell: bash
        run: |
          sync_options=(--archive --checksum --delete --exclude='/.*')
          rsync "${sync_options[@]}" .upstream/meme/meme_generator/memes/ meme_generator/memes/

          sync_options+=(--exclude='/README.md')
          rsync "${sync_options[@]}" .upstream/memes_jj/memes/ meme_generator/memes_jj/
          rsync "${sync_options[@]}" .upstream/memes_emoji/emoji/ meme_generator/memes_emoji/
          rsync "${sync_options[@]}" .upstream/memes_emoji_nsfw/emoji/ meme_generator/memes_emoji_nsfw/

          # 土豆仓库有两个表情多套了一层投稿目录。
          tudou_dir=.upstream/memes_tudou/meme
          while read -r wrapper nested key; do
            if [[ -f "$tudou_dir/$wrapper/$nested/__init__.py" && ! -e "$tudou_dir/$key" ]]; then
              mv "$tudou_dir/$wrapper/$nested" "$tudou_dir/$key"
              rmdir "$tudou_dir/$wrapper" || true
            fi
          done <<'TUDOU'
          汤圆骑猪_8pNJS 汤圆骑猪 tangyuanqizhu
          玩屎 玩屎 wanshi
          TUDOU

          while read -r pack source_dir; do
            rsync "${sync_options[@]}" ".upstream/$pack/$source_dir/" "meme_generator/$pack/"
            cp ".upstream/$pack/LICENSE" "meme_generator/$pack/LICENSE"
          done <<'PACKS'
          memes_cute memes
          memes_tudou meme
          memes_contrib memes
          memes_crazy_emoji emoji
          PACKS

          git add -A -- meme_generator/memes{,_jj,_emoji,_emoji_nsfw,_cute,_tudou,_contrib,_crazy_emoji}
          if git diff --cached --quiet; then
            echo '表情没有变更'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '同步表情更新'
          git push origin "HEAD:$GITHUB_REF"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: 触发镜像构建
        if: steps.sync_memes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yaml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: 触发 Wiki 更新
        if: steps.sync_memes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yaml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
